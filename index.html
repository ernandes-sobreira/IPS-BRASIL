<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IPS Brasil 2026 — Mapa de Indicadores</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1eb; --surface:#fff; --border:#e2ddd4;
  --text:#181614; --muted:#7a7268; --accent:#c93a0e;
  --yellow:#f0c000;
  --panel:352px; --hdr:52px; --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:'DM Sans',sans-serif;color:var(--text);font-size:15px;
  font-variant-numeric:tabular-nums;}

/* HEADER */
#hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hdr);
  background:var(--text);color:#fff;z-index:1000;
  display:flex;align-items:center;padding:0 14px;gap:8px;
}
#hdr-logo{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;
  letter-spacing:-.02em;flex:1;}
#hdr-logo span{color:var(--yellow);}
.hdr-btn{
  background:none;border:1.5px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.8);border-radius:6px;padding:4px 10px;
  font-size:.72rem;font-family:'Syne',sans-serif;font-weight:700;
  cursor:pointer;letter-spacing:.03em;transition:all .15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.hdr-btn svg{width:13px;height:13px;}
.hdr-btn:hover,.hdr-btn.on{background:rgba(255,255,255,.12);color:#fff;}
#btn-panel{display:none;}

/* APP SHELL */
#app{display:flex;height:100vh;padding-top:var(--hdr);}

/* PAINEL — flex column, altura fixa */
#panel{
  position:relative;
  width:var(--panel);min-width:var(--panel);
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column; /* CRÍTICO: column com height definido */
  height:calc(100vh - var(--hdr));
  overflow:hidden;
  z-index:200;transition:transform .28s cubic-bezier(.4,0,.2,1);
}

/* TABS — altura fixa */
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;height:40px;}
.tab{
  flex:1;height:100%;background:none;
  border:none;border-bottom:2.5px solid transparent;
  font-family:'Syne',sans-serif;font-size:.67rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  color:var(--muted);transition:all .14s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab svg{width:14px;height:14px;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}

/* CONTEÚDO DA TAB — min-height:0 é o fix para scroll dentro de flex */
.tab-body{
  flex:1;
  min-height:0; /* CRÍTICO: sem isso o flex filho ignora overflow */
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ÁREA DE SCROLL — ocupa tudo acima da legenda */
.scroll-area{
  flex:1;
  min-height:0; /* idem */
  overflow-y:scroll;
  overflow-x:hidden;
  padding:14px;
  /* scrollbar sempre visível e com cor */
  scrollbar-width:auto;
  scrollbar-color:#c8c2b8 transparent;
}
.scroll-area::-webkit-scrollbar{width:7px;}
.scroll-area::-webkit-scrollbar-track{background:#f0ece6;border-radius:4px;}
.scroll-area::-webkit-scrollbar-thumb{background:#c8c2b8;border-radius:4px;}
.scroll-area::-webkit-scrollbar-thumb:hover{background:#9a9288;}

/* LEGENDA — altura fixa, nunca some */
#legenda{
  flex-shrink:0;
  height:180px; /* altura explícita garante que o scroll acima saiba o espaço */
  padding:9px 14px 10px;
  border-top:2px solid var(--border);
  background:var(--surface);
  overflow:hidden;
}
#leg-ind{font-size:.8rem;font-weight:600;margin-bottom:1px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#leg-desc{font-size:.66rem;color:var(--muted);line-height:1.35;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* LEGENDA — escala semântica em degraus, limpa e legível */
#leg-ends{display:flex;justify-content:space-between;margin-bottom:3px;
  font-family:'Syne',sans-serif;font-size:.56rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.leg-scale{position:relative;display:flex;gap:2px;height:17px;margin:7px 0 9px;}
.leg-scale>div{flex:1;border-radius:2px;transition:background .3s ease;}
.leg-med{position:absolute!important;top:-4px;bottom:-4px;left:50%;width:2px;margin-left:-1px;
  background:#1a1a1a;border-radius:1px;pointer-events:none;flex:none!important;
  box-shadow:0 0 0 1px rgba(255,255,255,.65);}
.leg-med::after{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;background:#1a1a1a;box-shadow:0 0 0 1.5px #fff;}
#leg-axis{display:flex;align-items:baseline;font-size:.62rem;
  color:var(--muted);gap:6px;margin-bottom:5px;font-variant-numeric:tabular-nums;}
#leg-axis #leg-lo,#leg-axis #leg-hi{white-space:nowrap;flex-shrink:0;}
#leg-axis #leg-hi{text-align:right;}
#leg-med{flex:1;text-align:center;color:var(--text);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#leg-note{font-size:.62rem;color:var(--muted);line-height:1.35;
  padding:4px 8px;background:var(--bg);border-radius:5px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;
  vertical-align:middle;}
.leg-nodata{display:inline-flex;align-items:center;gap:4px;}
.leg-nodata-sw{width:11px;height:11px;border-radius:3px;background:#d8d4cc;
  border:1px solid #bbb;flex-shrink:0;display:inline-block;vertical-align:middle;}
#leg-dist{margin-top:5px;font-size:.62rem;color:var(--muted);line-height:1.35;
  font-variant-numeric:tabular-nums;}
#leg-dist b{color:var(--text);font-weight:600;}

/* SECTION LABEL */
.slabel{
  font-family:'Syne',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border);
}
.slabel:first-child{margin-top:0;}

/* CHIPS */
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px;}
.chip{
  width:100%;padding:6px 12px;border-radius:20px;font-size:.68rem;font-weight:700;
  font-family:'Syne',sans-serif;cursor:pointer;
  border:1.5px solid;transition:all .13s;white-space:nowrap;
  display:flex;align-items:center;justify-content:flex-start;gap:6px;
  overflow:hidden;text-overflow:ellipsis;
}
.chip svg{width:13px;height:13px;flex-shrink:0;}
.chip span{overflow:hidden;text-overflow:ellipsis;}

/* INDICADOR LISTA */
.ind-item{
  display:flex;flex-direction:column;gap:3px;padding:7px 9px;
  border-radius:7px;cursor:pointer;line-height:1.3;
  transition:background .1s;border:1.5px solid transparent;
}
.ind-item:hover{background:var(--bg);}
.ind-item.on{background:#fff5f3;border-color:#f5cdc5;}
.ind-item.on .ind-name{color:var(--accent);}
.ind-name{font-size:.78rem;font-weight:500;}
.ind-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.ind-unit{font-size:.62rem;color:var(--muted);}
.ind-dir{font-size:.55rem;font-family:'Syne',sans-serif;font-weight:700;
  padding:1px 7px;border-radius:10px;white-space:nowrap;letter-spacing:.02em;}
.ind-dir.melhor{color:#1e7a44;background:rgba(30,138,77,.13);}
.ind-dir.pior{color:#7a2da0;background:rgba(122,45,160,.13);}
.ind-dir.neutro{color:#5b6470;background:rgba(91,100,112,.12);}

/* BUSCA */
#srch-wrap{position:relative;margin-bottom:10px;}
#srch-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  opacity:.4;pointer-events:none;width:14px;height:14px;}
#srch{
  width:100%;padding:8px 10px 8px 30px;border:1.5px solid var(--border);
  border-radius:7px;font-size:.79rem;font-family:inherit;
  background:var(--bg);outline:none;transition:border-color .14s;
}
#srch:focus{border-color:var(--accent);background:#fff;}
.sr{
  padding:7px 9px;border-radius:6px;cursor:pointer;
  font-size:.77rem;display:flex;justify-content:space-between;align-items:center;
  gap:8px;transition:background .1s;
}
.sr:hover{background:var(--bg);}
.sr-nm{min-width:0;}
.sr-nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-meta{font-size:.62rem;color:var(--muted);margin-top:1px;}
.sr-uf{font-size:.65rem;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;flex-shrink:0;}
.sr-empty{font-size:.72rem;color:var(--muted);padding:8px 9px;}

/* FICHA */
#ficha-back{
  display:none;align-items:center;gap:5px;padding:6px 0 10px;
  font-size:.74rem;color:var(--muted);cursor:pointer;
  background:none;border:none;font-family:inherit;
}
#ficha-back svg{width:14px;height:14px;}
#ficha-back:hover{color:var(--accent);}
#ficha-hdr{
  position:relative;
  padding:14px;background:var(--text);color:#fff;
  border-radius:var(--r);margin-bottom:10px;
}
.f-nome{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;padding-right:24px;}
.f-sub{font-size:.72rem;color:rgba(255,255,255,.55);margin-top:2px;}
.f-close{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);
  border:none;color:#fff;cursor:pointer;width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;transition:background .14s;}
.f-close:hover{background:rgba(255,255,255,.25);}
.f-close svg{width:14px;height:14px;}
.f-ips{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
.f-ips-v{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--yellow);}
.f-ips-l{font-size:.69rem;color:rgba(255,255,255,.5);line-height:1.4;}
.f-rank{margin-top:8px;font-size:.66rem;color:rgba(255,255,255,.6);}
.f-rank b{color:var(--yellow);font-weight:700;}
.f-caption{font-size:.62rem;color:var(--muted);line-height:1.4;
  padding:6px 8px;background:var(--bg);border-radius:6px;margin-bottom:12px;}
.f-caption .leg-dot{margin:0 1px;}
.fgrp{margin-bottom:14px;}
.fgrp-t{
  font-family:'Syne',sans-serif;font-size:.59rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:7px 0 5px;border-bottom:1px solid var(--border);margin-bottom:6px;
  display:flex;align-items:center;gap:5px;
}
.fgrp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.find{
  display:flex;align-items:center;padding:5px 0;
  border-bottom:1px solid #f0ece6;gap:8px;cursor:pointer;
}
.find:last-child{border:none;}
.find-info{flex:1;min-width:0;}
.find-n{font-size:.72rem;font-weight:500;line-height:1.3;}
.find-s{font-size:.62rem;color:var(--muted);margin-top:1px;}
.find-bar-wrap{position:relative;height:6px;background:#ede9e2;border-radius:3px;margin-top:6px;}
.find-bar{height:100%;border-radius:3px;transition:width .3s ease,background .3s ease;}
.find-tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;
  background:var(--text);border-radius:1px;}
.find-tick::after{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--text);}
.find-ativo{background:#fff5f3;border-radius:6px;padding:5px 6px;margin:0 -6px;}
.find:hover{background:#f7f5f0;border-radius:6px;}
.find-ver-mapa{font-size:.58rem;color:var(--muted);font-family:'Syne',sans-serif;
  font-weight:700;opacity:0;transition:opacity .15s;margin-left:4px;}
.find:hover .find-ver-mapa{opacity:1;}
.find-no-mapa{font-size:.58rem;color:var(--accent);font-family:'Syne',sans-serif;
  font-weight:700;margin-left:4px;}
.find-v{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;
  text-align:right;flex-shrink:0;}
.find-u{font-size:.58rem;color:var(--muted);display:block;}

/* RANKINGS */
.rk-sel{
  width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;
  font-size:.75rem;font-family:inherit;background:var(--bg);outline:none;
  margin-bottom:8px;cursor:pointer;
}
.toggle-g{display:flex;gap:4px;margin-bottom:8px;}
.tog{
  padding:5px 12px;border-radius:6px;font-size:.69rem;font-weight:700;
  font-family:'Syne',sans-serif;cursor:pointer;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--muted);transition:all .13s;
  display:inline-flex;align-items:center;gap:4px;
}
.tog svg{width:12px;height:12px;}
.tog.on{background:var(--text);color:#fff;border-color:var(--text);}
.rk-tools{display:flex;justify-content:flex-end;margin-bottom:4px;}
#btn-csv{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:6px;font-size:.65rem;font-weight:700;
  font-family:'Syne',sans-serif;cursor:pointer;
  border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  transition:all .13s;
}
#btn-csv svg{width:12px;height:12px;}
#btn-csv:hover{background:var(--text);color:#fff;border-color:var(--text);}
.rk-item{
  display:flex;align-items:center;gap:7px;padding:6px 7px;
  border-radius:7px;cursor:pointer;transition:background .1s;font-size:.75rem;
}
.rk-item:hover{background:var(--bg);}
.rk-pos{font-family:'Syne',sans-serif;font-weight:800;font-size:.65rem;
  color:var(--muted);width:16px;flex-shrink:0;text-align:right;}
.rk-nm{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-uf{font-size:.61rem;color:var(--muted);}
.rk-bar-wrap{flex-basis:50px;flex-shrink:0;height:6px;background:#ede9e2;
  border-radius:3px;overflow:hidden;}
.rk-bar{height:100%;border-radius:3px;transition:width .3s ease;}
.rk-v{font-family:'Syne',sans-serif;font-weight:700;font-size:.77rem;
  flex-shrink:0;width:46px;text-align:right;}

/* MAPA */
#map-wrap{flex:1;position:relative;overflow:hidden;}
#map{position:absolute;inset:0;}

/* TRANSIÇÃO SUAVE ao trocar indicador (fill animável via CSS) */
#map path.leaflet-interactive{
  transition:fill .3s ease, fill-opacity .3s ease;
}

/* MUNICÍPIO SELECIONADO — contorno pulsante */
@keyframes munPulse{
  0%,100%{stroke-opacity:1;stroke-width:3.2px;}
  50%{stroke-opacity:.35;stroke-width:6px;}
}
#map path.leaflet-interactive.mun-pulse{
  stroke:#1a1814 !important;
  animation:munPulse 1.4s ease-in-out infinite;
}
/* Marcador do município selecionado no mapa */
.marcador-sel{
  background:var(--text);color:#fff;
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:.72rem;padding:5px 10px;border-radius:20px;
  white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.25);
  border:2px solid var(--yellow);
}

/* TOOLTIP */
.mtt{
  background:var(--text) !important;color:#fff !important;
  border:none !important;border-radius:8px !important;
  padding:8px 11px !important;font-family:'DM Sans',sans-serif !important;
  font-size:.74rem !important;box-shadow:0 4px 20px rgba(0,0,0,.25) !important;
  pointer-events:none !important;min-width:140px;
  font-variant-numeric:tabular-nums;
}
.mtt-nm{font-family:'Syne',sans-serif;font-weight:800;font-size:.79rem;}
.mtt-v{color:var(--yellow);font-weight:600;margin-top:3px;}
.mtt-ind{color:rgba(255,255,255,.45);font-size:.66rem;margin-top:2px;}
.mtt-rk{color:rgba(255,255,255,.75);font-size:.66rem;margin-top:4px;
  border-top:1px solid rgba(255,255,255,.12);padding-top:4px;}
.mtt-rk b{color:#fff;font-family:'Syne',sans-serif;font-weight:700;}

/* LOADING — barra fina + skeleton */
#loadbar{position:fixed;top:var(--hdr);left:0;right:0;height:3px;
  background:rgba(0,0,0,.06);z-index:1500;overflow:hidden;}
#loadbar-fill{height:100%;width:0;background:var(--yellow);
  transition:width .3s ease;}
#loadbar.done{opacity:0;transition:opacity .4s ease .2s;pointer-events:none;}

@keyframes shimmer{0%{background-position:-450px 0;}100%{background-position:450px 0;}}
.skel{background:#ece8e1;
  background-image:linear-gradient(90deg,#ece8e1 0,#f6f3ee 220px,#ece8e1 440px);
  background-size:880px 100%;animation:shimmer 1.3s linear infinite;border-radius:6px;}
.skel-screen{position:absolute;inset:0;background:var(--surface);z-index:300;
  padding:18px 14px;transition:opacity .4s ease;}
.skel-screen.hide{opacity:0;pointer-events:none;}
.skel-line{height:12px;margin-bottom:10px;}
.skel-chip{display:inline-block;height:24px;width:72px;border-radius:20px;margin:0 5px 8px 0;}
.skel-row{height:42px;margin-bottom:8px;border-radius:7px;}
#skel-map{position:absolute;inset:0;z-index:300;background:#e8e4dc;
  display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}
#skel-map.hide{opacity:0;pointer-events:none;}
#skel-map .skel-blob{width:46%;height:62%;border-radius:14px;}
.load-err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--text);color:#fff;padding:14px 18px;border-radius:10px;
  font-size:.8rem;max-width:80%;text-align:center;z-index:400;}

/* SPLASH inicial de marca (curto) */
#splash{position:fixed;inset:0;background:var(--text);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:opacity .45s ease;}
#splash.hide{opacity:0;pointer-events:none;}
.sp-logo{font-family:'Syne',sans-serif;font-size:2.6rem;font-weight:800;color:var(--yellow);}
.sp-title{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;color:#fff;}

/* MOBILE */
@media(max-width:768px){
  #btn-panel{display:inline-flex;}
  #panel{
    position:fixed;top:var(--hdr);left:0;bottom:0;
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.15);
    width:min(var(--panel),93vw);
  }
  #panel.open{transform:translateX(0);}
}
body.desktop #panel{position:relative;transform:none !important;}
body.desktop #btn-panel{display:none;}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-logo">IPS</div>
  <div class="sp-title">Brasil 2026</div>
</div>

<div id="hdr">
  <div id="hdr-logo">IPS <span>Brasil</span> 2026</div>
  <button class="hdr-btn" id="btn-panel" onclick="togglePanel()"><i data-lucide="panel-left"></i> Painel</button>
  <button class="hdr-btn" id="btn-desktop" onclick="toggleDesktop()"><i data-lucide="monitor"></i> Desktop</button>
</div>

<div id="loadbar"><div id="loadbar-fill"></div></div>

<div id="app">
  <div id="panel">
    <div id="tabs">
      <button class="tab on" onclick="showTab('mapa',this)"><i data-lucide="map"></i><span>Mapa</span></button>
      <button class="tab"    onclick="showTab('explorar',this)"><i data-lucide="search"></i><span>Explorar</span></button>
      <button class="tab"    onclick="showTab('rankings',this)"><i data-lucide="trophy"></i><span>Rankings</span></button>
    </div>

    <!-- TAB MAPA -->
    <div id="tab-mapa" class="tab-body">
      <div class="scroll-area">
        <div class="slabel">Categoria</div>
        <div class="chips" id="mapa-chips"></div>
        <div class="slabel">Indicador visualizado</div>
        <div id="ind-list"></div>
      </div>
    </div>

    <!-- TAB EXPLORAR -->
    <div id="tab-explorar" class="tab-body" style="display:none;">
      <div class="scroll-area">
        <button id="ficha-back" onclick="backSearch()"><i data-lucide="arrow-left"></i> voltar à busca</button>
        <div id="srch-sec">
          <div class="slabel">Buscar município</div>
          <div id="srch-wrap">
            <i data-lucide="search"></i>
            <input type="text" id="srch" placeholder="Nome do município…"
              oninput="searchMun(this.value)" autocomplete="off"/>
          </div>

<script>
// ─── ESTADO ───────────────────────────────────────────────────────────────────
let D=null,GEO=null;
let geoLayer=null,leaf=null;
let IND='Índice de Progresso Social';
let rankInd='Índice de Progresso Social';
let rankDir='top';
let munIdx={};
let layerByChave={};    // chave normalizada -> layer leaflet
let chaveToCd={}, cdToChave={};  // mapeamento código IBGE <-> chave
let munSel=null;        // dados do município selecionado
let featureSel=null;    // layer leaflet selecionado
let chaveSel=null;      // chave normalizada do selecionado
let markerSel=null;     // marcador com nome no mapa
let catMapa='Geral',catRank='Geral';
let FUSE=null;          // índice de busca fuzzy
let escCache={}, rankCache={}, quintCache={}; // caches por indicador
let selfHash='';        // hash que a própria app definiu (evita loop)

const CORES={
  'Geral':'#1644a8','Saúde':'#c93a0e','Segurança':'#7a1515',
  'Educação':'#1a6b3c','Infraestrutura':'#6b3fa0',
  'Meio Ambiente':'#0f7a3c','Social':'#b86b00','Justiça':'#4a4040'
};
// Ícones Lucide por categoria (item 7)
const CAT_ICON={
  'Geral':'gauge','Saúde':'heart','Segurança':'shield','Educação':'book-open',
  'Infraestrutura':'construction','Meio Ambiente':'leaf','Social':'users','Justiça':'scale'
};
const GRUPOS={
  'Geral':['Índice de Progresso Social','Necessidades Humanas Básicas',
    'Fundamentos do Bem-estar','Oportunidades','POPULAÇÃO 2025','PIB PER CAPITA','ÁREA km²'],
  'Saúde':['Expectativa de Vida ','Mortalidade Infantil até 5 anos',
    'Mortalidade entre 15 e 50 anos','Mortalidades por Doenças Crônicas Não Transmissíveis ',
    'Obesidade','Suicídios','Subnutrição','Cobertura Vacinal (poliomielite)',
    'Hospitalizações por Condições Sensíveis à Atenção Primária',
    'Mortalidade Ajustada por Condições Sensíveis à Atenção Primária',
    'Consumo de ultraprocessados','Nutrição e Cuidados Médicos Básicos','Saúde e Bem-estar'],
  'Segurança':['Homicídios','Assassinatos de Jovens','Assassinatos de Mulheres',
    'Mortes por Acidentes de Transporte','Violência Contra Mulheres',
    'Violência Contra Negros','Violência Contra Indígenas',
    'Famílias em Situação de Rua','Segurança Pessoal'],
  'Educação':['Ideb Ensino Fundamental','Nota Mediana no Enem',
    'Abandono no Ensino Fundamental','Abandono no Ensino Médio',
    'Evasão no Ensino Médio','Distorção Idade-Série no Ensino Médio',
    'Reprovação Escolar no Ensino Médio','Acesso ao Conhecimento Básico',
    'Acesso à Educação Superior','Empregados com Ensino Superior',
    'Mulheres Empregadas com Ensino Superior'],
  'Infraestrutura':['Água e Saneamento','Abastecimento de Água Via Rede de Distribuição',
    'Esgotamento Sanitário Adequado','Índice de Abastecimento de Água',
    'Índice de Perdas de Água na Distribuição','Domicílios com Coleta de Resíduos Adequada',
    'Domicílios com Iluminação Elétrica Adequada','Domicílios com Paredes Adequadas',
    'Domicílios com Pisos Adequados','Moradia','Cobertura de Internet Móvel (4G/5G)',
    'Densidade de Internet Banda Larga Fixa','Densidade Telefonia Móvel',
    'Qualidade de Internet Móvel','Acesso à Informação e Comunicação'],
  'Meio Ambiente':['Emissões de CO₂e por Habitante','Focos de Calor',
    'Áreas Verdes Urbanas','Praças e Parques em Áreas Urbanas',
    'Supressão da Vegetação Primária e Secundária','Qualidade do Meio Ambiente',
    'Índice de Vulnerabilidade Climática dos Municípios (IVCM)'],
  'Social':['Inclusão Social','Gravidez na Adolescência (<19)',
    'Índice de Vulnerabilidade das Famílias do CadÚnico (IVCAD)',
    'Paridade de Gênero na Câmara Municipal','Paridade de Negros na Câmara Municipal',
    'Liberdades Individuais e de Escolha','Acesso à Cultura, Lazer e Esporte',
    'Acesso a Programas de Direitos Humanos','Existência de Ações para Direitos de Minorias'],
  'Justiça':['Direitos Individuais','Índice de Atendimento à Demanda de Justiça',
    'Resposta a Processos Previdenciários','Resposta a Processos Familiares',
    'Taxa de Congestionamento Líquida de Processos']
};

// slug <-> indicador (permalink)
let slugToInd={}, indToSlug={};

// ─── CORES: azul=menor, vermelho=maior, SEMPRE ────────────────────────────────
function getEsc(ind){
  if(escCache[ind]) return escCache[ind];
  const vs=D.municipios.map(m=>m.i[ind]).filter(v=>v!=null).sort((a,b)=>a-b);
  let e;
  if(!vs.length) e={p5:0,p95:1,mid:.5,min:0,max:1,p25:0,p75:1};
  else e={
    p5:vs[Math.floor(vs.length*.05)],
    p95:vs[Math.floor(vs.length*.95)],
    mid:vs[Math.floor(vs.length*.5)],
    p25:vs[Math.floor(vs.length*.25)],
    p75:vs[Math.floor(vs.length*.75)],
    min:vs[0], max:vs[vs.length-1]
  };
  escCache[ind]=e; return e;
}
// Paleta DIVERGENTE semântica: 0 = pior, 1 = melhor (roxo → laranja → verde)
const PAL_QUAL=[
  [0.00,[106, 27,154]], // roxo  — pior
  [0.25,[194, 65,143]], // magenta
  [0.50,[245,158, 44]], // laranja — médio
  [0.75,[155,191, 60]], // verde-limão
  [1.00,[ 30,138, 77]]  // verde — melhor
];
// Paleta SEQUENCIAL neutra (apenas magnitude, sem juízo de bom/ruim)
const PAL_NEUTRA=[
  [0.00,[223,231,239]], // claro
  [0.50,[111,159,196]],
  [1.00,[ 31, 59, 99]]  // escuro
];
function lp(a,b,t){return Math.round(a+(b-a)*t);}
function clamp01(t){return Math.max(0,Math.min(1,t));}
function rampColor(stops,t){
  t=clamp01(t);
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){
      const a=stops[i-1],b=stops[i],f=(t-a[0])/(b[0]-a[0]+1e-9);
      return`rgb(${lp(a[1][0],b[1][0],f)},${lp(a[1][1],b[1][1],f)},${lp(a[1][2],b[1][2],f)})`;
    }
  }
  const c=stops[stops.length-1][1]; return`rgb(${c[0]},${c[1]},${c[2]})`;
}
function isNeutro(ind){return !!(D.meta[ind]&&D.meta[ind].maior==='neutro');}
// escala "0–N" embutida na unidade (pontos 0-100 / 0-1000 / nota 0-10) → máximo
function scaleMax(ind){const u=(D.meta[ind]&&D.meta[ind].unidade)||'';
  if(u.includes('0-1000'))return 1000; if(u.includes('0-100'))return 100; if(u.includes('0-10'))return 10; return null;}
// posição 0..1 do valor na faixa nacional (p5..p95)
function posVal(v,ind){const e=getEsc(ind);return clamp01((v-e.p5)/(e.p95-e.p5+.001));}

// ── QUINTIS: 5 faixas, cada uma = 20% das cidades ────────────────────────────
const QUINT_QUAL  =[0,.25,.5,.75,1].map(t=>rampColor(PAL_QUAL,t));   // 0=pior … 4=melhor
const QUINT_NEUTRA=[0,.25,.5,.75,1].map(t=>rampColor(PAL_NEUTRA,t)); // claro … escuro
function getQuintis(ind){
  if(quintCache[ind]) return quintCache[ind];
  const vs=D.municipios.map(m=>m.i[ind]).filter(v=>v!=null).sort((a,b)=>a-b);
  const th=[]; for(let k=1;k<=4;k++) th.push(vs.length?vs[Math.floor(vs.length*k/5)]:0);
  return quintCache[ind]={th,n:vs.length};
}
function quintIdx(v,ind){const{th}=getQuintis(ind);let i=0;while(i<4&&v>=th[i])i++;return i;} // por valor ↑
function quintQual(v,ind){const i=quintIdx(v,ind);return D.meta[ind]&&D.meta[ind].maior==='pior'?4-i:i;} // 0=pior,4=melhor
// cor semântica final — 5 classes (quintis)
function corInd(v,ind){
  if(v==null) return '#d8d4cc';
  return isNeutro(ind)?QUINT_NEUTRA[quintIdx(v,ind)]:QUINT_QUAL[quintQual(v,ind)];
}
// cor da faixa j (0=esquerda/pior … 4=direita/melhor) — usada na legenda
function corQuintilLeg(j,ind){return isNeutro(ind)?QUINT_NEUTRA[j]:QUINT_QUAL[j];}
// comprimento da barra: escalas 0–N vão de 0 a N; demais usam posição na faixa nacional
function barFrac(v,ind){const mx=scaleMax(ind);return mx?clamp01(v/mx):posVal(v,ind);}

// Ranking nacional (1º = melhor; direção depende de maior=melhor/pior)
function getRank(ind){
  if(rankCache[ind]) return rankCache[ind];
  const meta=D.meta[ind];
  const asc = meta && meta.maior==='pior';   // pior: menor valor é melhor -> 1º
  const arr=D.municipios.filter(m=>m.i[ind]!=null)
    .map(m=>({k:chaveOf(m),v:m.i[ind]}));
  arr.sort((a,b)=> asc ? a.v-b.v : b.v-a.v);
  const pos={};
  arr.forEach((x,i)=>{pos[x.k]=i+1;});
  const r={pos,total:arr.length};
  rankCache[ind]=r; return r;
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
async function boot(){
  setBar(8);
  // Mostra a marca por um instante, depois revela o skeleton durante o carregamento
  setTimeout(()=>{const s=document.getElementById('splash');if(s)s.classList.add('hide');},650);
  try{const r=await fetch('conhece_brasil_v1.json');D=await r.json();}
  catch(e){return erro('Erro ao carregar dados IPS (conhece_brasil_v1.json).');}
  setBar(42);

  // Geometrias: TopoJSON (leve) com fallback para GeoJSON
  try{
    const r=await fetch('municipios_topo.json');
    const topo=await r.json();
    GEO=topojson.feature(topo,topo.objects.municipios);
  }catch(e){
    try{const r=await fetch('municipios_geo.geojson');GEO=await r.json();}
    catch(e2){return erro('Erro ao carregar geometrias dos municípios.');}
  }
  setBar(68);

  // Indexação
  for(const m of D.municipios) munIdx[chaveOf(m)]=m;
  for(const f of GEO.features){
    const p=f.properties;
    p._k=nrm(p.NM_MUN||'')+'_'+nrm(p.SIGLA_UF||'');
    p._d=munIdx[p._k]||null;
    if(p.CD_MUN){chaveToCd[p._k]=String(p.CD_MUN);cdToChave[String(p.CD_MUN)]=p._k;}
  }
  buildSlugs();
  buildSearchIndex();
  setBar(86);

  await sleep(60);
  initUI();
  aplicarHash();
  window.addEventListener('hashchange',onHashChange);

  setBar(100);
  pronto();
}

function setBar(pct){document.getElementById('loadbar-fill').style.width=pct+'%';}
function erro(msg){
  document.getElementById('splash').classList.add('hide');
  const sm=document.getElementById('skel-map');
  sm.innerHTML='<div class="load-err">'+msg+'</div>';
  sm.style.background='var(--bg)';
}
function pronto(){
  document.getElementById('skel-panel').classList.add('hide');
  document.getElementById('skel-map').classList.add('hide');
  document.getElementById('loadbar').classList.add('done');
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('skel-panel').remove();
    document.getElementById('skel-map').remove();
    document.getElementById('splash').remove();
    leaf&&leaf.invalidateSize();
  },500);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function nrm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function chaveOf(m){return nrm(m.m)+'_'+nrm(m.u);}
function icons(){if(window.lucide) lucide.createIcons();}

// slugs para permalink de indicadores
function buildSlugs(){
  for(const ind of Object.keys(D.meta)){
    let s=nrm(ind).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    // evita colisão
    let base=s,i=2; while(slugToInd[s]){s=base+'-'+(i++);}
    slugToInd[s]=ind; indToSlug[ind]=s;
  }
}
function catDeInd(ind){
  for(const[cat,inds]of Object.entries(GRUPOS)) if(inds.includes(ind)) return cat;
  return null;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initUI(){
  initMapa();
  criarCamadaMapa();
  buildChips('rank-chips',catRank,onCatRank);
  buildRank();
  setIndicador(IND,true);   // monta chips/lista/estilos/legenda do mapa
  icons();
}

// ─── MAPA ─────────────────────────────────────────────────────────────────────
function initMapa(){
  leaf=L.map('map',{zoomControl:false,attributionControl:false,preferCanvas:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(leaf);
  L.control.zoom({position:'bottomright'}).addTo(leaf);
  leaf.setView([-14,-52],4);
}

function getEstiloNormal(f){
  const d=f.properties._d, v=d?d.i[IND]:null;
  if(v==null) return{fillColor:'#d8d4cc',weight:.3,color:'#bbb',fillOpacity:.7};
  return{fillColor:corInd(v,IND),weight:.3,color:'rgba(0,0,0,.12)',fillOpacity:.9};
}

// Cria a camada UMA vez. Trocar indicador apenas re-estiliza (transição suave).
function criarCamadaMapa(){
  geoLayer=L.geoJSON(GEO,{
    style:f=>getEstiloNormal(f),
    onEachFeature:(f,layer)=>{
      const p=f.properties;
      layerByChave[p._k]=layer;
      // Tooltip dinâmico: lê o indicador atual a cada abertura
      layer.bindTooltip(()=>tooltipHTML(p),{className:'mtt',sticky:true,opacity:1});
      layer.on('click',()=>{if(p._d) selecionarMun(p._d,layer,p._k,false);});
      layer.on('mouseover',e=>{if(p._k!==chaveSel) e.target.setStyle({weight:1.5,color:'#333'});});
      layer.on('mouseout',e=>{if(p._k!==chaveSel) geoLayer.resetStyle(e.target);});
    }
  }).addTo(leaf);
}

function tooltipHTML(p){
  const d=p._d, meta=D.meta[IND];
  const nm=p.NM_MUN||'', uf=p.SIGLA_UF||'';
  const un=meta?meta.unidade:'';
  const v=d?d.i[IND]:null;
  let rk='';
  if(d&&v!=null){
    const r=getRank(IND), pos=r.pos[p._k];
    if(pos) rk=`<div class="mtt-rk"><b>${pos}º</b> de ${r.total.toLocaleString('pt-BR')}</div>`;
  }
  return `<div class="mtt-nm">${nm} — ${uf}</div>
    <div class="mtt-v">${v!=null?fmt(v)+' <span style="opacity:.6;font-size:.68em">'+un+'</span>':'sem dado'}</div>
    <div class="mtt-ind">${meta?meta.nome:IND}</div>${rk}`;
}

// Re-estiliza todos os polígonos para o indicador atual (sem recriar a camada)
function aplicarEstilos(){
  if(!geoLayer) return;
  geoLayer.eachLayer(layer=>layer.setStyle(getEstiloNormal(layer.feature)));
  if(chaveSel&&featureSel) destacarFeature(featureSel);
}

function selecionarMun(m,layer,chave,fromHash){
  limparSelecao();
  munSel=m;
  chaveSel=chave||chaveOf(m);
  featureSel=layer;
  if(layer) destacarFeature(layer);

  if(m.lat&&m.lon){
    const icon=L.divIcon({className:'',html:`<div class="marcador-sel">${m.m}</div>`,iconAnchor:[0,0]});
    markerSel=L.marker([m.lat,m.lon],{icon,zIndexOffset:1000}).addTo(leaf);
    leaf.setView([m.lat,m.lon],9,{animate:true});
  }
  abrirFicha(m);
  if(!fromHash){const cd=chaveToCd[chaveSel]; if(cd) setHash('mun/'+cd);}
}

function limparSelecao(){
  if(featureSel){
    if(featureSel._path) featureSel._path.classList.remove('mun-pulse');
    if(geoLayer) geoLayer.resetStyle(featureSel);
  }
  if(markerSel){leaf.removeLayer(markerSel);markerSel=null;}
}

function destacarFeature(layer){
  if(!layer) return;
  const est=getEstiloNormal(layer.feature);
  layer.setStyle({...est,weight:3.2,color:'#1a1814',fillOpacity:.95});
  layer.bringToFront();
  if(layer._path) layer._path.classList.add('mun-pulse'); // contorno pulsante
}

// ─── LEGENDA — 5 quintis (cada cor = 20% das cidades) + mediana ───────────────
function atualizarLegenda(ind,esc,meta){
  const un=meta?meta.unidade:'';
  const neutro=isNeutro(ind);
  const pior=!!(meta&&meta.maior==='pior');
  document.getElementById('leg-ind').textContent=meta?meta.nome:ind;
  document.getElementById('leg-desc').textContent=meta?meta.simples:'';

  // Rótulos das pontas: pior→melhor (semântico) ou menor→maior (neutro)
  document.getElementById('leg-end-lo').textContent=neutro?'MENOR':'PIOR';
  document.getElementById('leg-end-hi').textContent=neutro?'MAIOR':'MELHOR';

  // 5 faixas de quintil. Limites por valor crescente: [min, t20,t40,t60,t80, max]
  const th=getQuintis(ind).th;
  const bounds=[esc.min,...th,esc.max];
  // ordem de exibição esq→dir = pior→melhor; em "maior=pior" inverte
  const order=pior?[4,3,2,1,0]:[0,1,2,3,4];
  let sc='';
  order.forEach((blk,pos)=>{
    const lo=bounds[blk], hi=bounds[blk+1];
    const titulo=`${neutro?(pos+1)+'ª faixa':(pos+1)+'º quinto'} · ${fmt(lo)}–${fmt(hi)} ${un}\n20% das cidades`;
    sc+=`<div style="background:${corQuintilLeg(pos,ind)}" title="${titulo}"></div>`;
  });
  sc+=`<div class="leg-med" title="mediana nacional: ${fmt(esc.mid)} ${un}"></div>`;
  document.getElementById('leg-scale').innerHTML=sc;

  // Pontas = extremos; centro = mediana
  const worstV=neutro?esc.min:(pior?esc.max:esc.min);
  const bestV =neutro?esc.max:(pior?esc.min:esc.max);
  document.getElementById('leg-lo').textContent=fmt(worstV)+' '+un;
  document.getElementById('leg-hi').textContent=fmt(bestV)+' '+un;
  document.getElementById('leg-med').textContent='mediana '+fmt(esc.mid);

  let semDado=0; for(const m of D.municipios) if(m.i[ind]==null) semDado++;
  const semTxt=`<span class="leg-nodata"><span class="leg-nodata-sw"></span> ${semDado.toLocaleString('pt-BR')} sem dado</span>`;
  const note=document.getElementById('leg-note');
  note.innerHTML = neutro
    ? `<span>Escala neutra — só magnitude, sem bom/ruim.</span>${semTxt}`
    : `<span><span class="leg-dot" style="background:rgb(106,27,154)"></span> pior`+
      ` &nbsp; <span class="leg-dot" style="background:rgb(30,138,77)"></span> melhor</span>${semTxt}`;

  // Explicação das cores em linguagem simples
  document.getElementById('leg-dist').innerHTML=
    `Cada cor reúne <b>20% das cidades</b> (um quinto). O traço <b>●│</b> marca a mediana.`;
}

// ─── CHIPS ────────────────────────────────────────────────────────────────────
function onCatMapa(cat){
  catMapa=cat;
  buildChips('mapa-chips',catMapa,onCatMapa);
  buildIndList(); icons();
}
function onCatRank(cat){
  catRank=cat;
  const inds=GRUPOS[cat]||[];
  rankInd=inds[0]||rankInd;
  buildChips('rank-chips',catRank,onCatRank);
  buildRank(); icons();
}
function buildChips(id,ativa,cb){
  const wrap=document.getElementById(id);
  wrap.innerHTML='';
  for(const[cat,cor]of Object.entries(CORES)){
    const el=document.createElement('button');
    el.className='chip';
    el.innerHTML=`<i data-lucide="${CAT_ICON[cat]||'circle'}"></i><span>${cat}</span>`;
    el.style.borderColor=cor;
    if(cat===ativa){el.style.color='#fff';el.style.background=cor;}
    else{el.style.color=cor;el.style.background='transparent';}
    el.onclick=()=>cb(cat);
    wrap.appendChild(el);
  }
}

function buildIndList(){
  const wrap=document.getElementById('ind-list');
  wrap.innerHTML='';
  for(const ind of GRUPOS[catMapa]||[]){
    const meta=D.meta[ind];if(!meta) continue;
    const mm=meta.maior;
    const dirCls=mm==='melhor'?'melhor':mm==='pior'?'pior':'neutro';
    const dirTxt=mm==='melhor'?'↑ maior é melhor':mm==='pior'?'↑ maior é pior':'sem bom/ruim';
    const el=document.createElement('div');
    el.className='ind-item'+(ind===IND?' on':'');
    el.innerHTML=`<div class="ind-name">${meta.nome}</div>
      <div class="ind-meta"><span class="ind-unit">${meta.unidade}</span><span class="ind-dir ${dirCls}">${dirTxt}</span></div>`;
    el.onclick=()=>setIndicador(ind);
    wrap.appendChild(el);
  }
}

// Ponto único de troca de indicador (mapa + legenda + lista + permalink)
function setIndicador(ind,fromHash){
  IND=ind;
  const cat=catDeInd(ind); if(cat) catMapa=cat;
  buildChips('mapa-chips',catMapa,onCatMapa);
  buildIndList();
  aplicarEstilos();
  atualizarLegenda(ind,getEsc(ind),D.meta[ind]);
  if(munSel) refreshFichaAtivo();
  icons();
  if(!fromHash) setHash('ind/'+indToSlug[ind]);
}

// ─── FICHA ────────────────────────────────────────────────────────────────────
function abrirFicha(m){
  showTab('explorar',document.querySelectorAll('.tab')[1]);
  document.getElementById('srch-sec').style.display='none';
  document.getElementById('ficha-back').style.display='flex';

  const ips=m.i['Índice de Progresso Social'];
  const pop=m.i['POPULAÇÃO 2025'];
  const pib=m.i['PIB PER CAPITA'];
  const rIps=getRank('Índice de Progresso Social');
  const posIps=rIps.pos[chaveOf(m)];

  let html=`<div id="ficha-hdr">
    <button class="f-close" onclick="backSearch()" title="Fechar ficha"><i data-lucide="x"></i></button>
    <div class="f-nome">${m.m}</div>
    <div class="f-sub">${m.u} · ${m.r}${pop?' · '+fmtPop(pop)+' hab.':''}${pib?' · PIB pc R$'+fmt(pib):''}</div>
    <div class="f-ips">
      <span class="f-ips-v">${ips!=null?ips.toFixed(1):'—'}</span>
      <span class="f-ips-l">IPS Brasil 2026<br>escala 0–100, maior = melhor</span>
    </div>
    ${posIps?`<div class="f-rank">Ranking IPS nacional: <b>${posIps}º</b> de ${rIps.total.toLocaleString('pt-BR')}</div>`:''}
  </div>
  <div class="f-caption">Barra = valor · cor = quintil nacional (<span class="leg-dot" style="background:rgb(106,27,154)"></span> pior &nbsp;→&nbsp; <span class="leg-dot" style="background:rgb(30,138,77)"></span> melhor). O traço escuro <b>●│</b> marca a média do estado (${m.u}).</div>`;

  const medUF=D.medias_por_uf[m.u]||{};

  for(const[grp,inds]of Object.entries(GRUPOS)){
    const corGrp=CORES[grp];
    const linhas=inds.map(ind=>{
      const meta=D.meta[ind],v=m.i[ind];
      if(!meta||v==null) return'';
      // comprimento da barra = valor (escalas 0–N vão de 0 a N); cor = quintil
      const pct=Math.round(barFrac(v,ind)*100);
      const barCor=corInd(v,ind);
      const med=medUF[ind];
      const medFrac=med!=null?barFrac(med,ind):null;
      const isAtivo=ind===IND;
      const slug=indToSlug[ind];
      const tick=medFrac!=null?`<div class="find-tick" style="left:${(medFrac*100).toFixed(1)}%" title="média ${m.u}: ${fmt(med)} ${meta.unidade}"></div>`:'';
      return`<div class="find${isAtivo?' find-ativo':''}" data-ind="${slug}" onclick="mudarIndicador('${slug}')" title="Ver no mapa">
        <div class="find-info">
          <div class="find-n">${meta.nome} <span class="find-badge ${isAtivo?'find-no-mapa':'find-ver-mapa'}">${isAtivo?'no mapa ↗':'ver no mapa'}</span></div>
          <div class="find-s">${meta.simples}</div>
          <div class="find-bar-wrap"><div class="find-bar" style="width:${pct}%;background:${barCor}"></div>${tick}</div>
        </div>
        <div class="find-v">${fmt(v)}<span class="find-u">${meta.unidade}</span></div>
      </div>`;
    }).filter(Boolean).join('');
    if(!linhas) continue;
    html+=`<div class="fgrp">
      <div class="fgrp-t"><span class="fgrp-dot" style="background:${corGrp}"></span>${grp}</div>
      ${linhas}
    </div>`;
  }

  document.getElementById('ficha').innerHTML=html;
  icons();
  if(window.innerWidth<=768&&!document.body.classList.contains('desktop')) closePanel();
}

// Atualiza só o destaque "no mapa" da ficha quando o indicador muda
function refreshFichaAtivo(){
  document.querySelectorAll('#ficha .find').forEach(f=>{
    const on=f.dataset.ind===indToSlug[IND];
    f.classList.toggle('find-ativo',on);
    const b=f.querySelector('.find-badge');
    if(b){b.className='find-badge '+(on?'find-no-mapa':'find-ver-mapa');b.textContent=on?'no mapa ↗':'ver no mapa';}
  });
}

function mudarIndicador(slug){
  const ind=slugToInd[slug]; if(!ind) return;
  setIndicador(ind);
}

function backSearch(){
  document.getElementById('ficha').innerHTML='';
  document.getElementById('srch-sec').style.display='block';
  document.getElementById('ficha-back').style.display='none';
  document.getElementById('srch').value='';
  document.getElementById('srch-res').innerHTML='';
  limparSelecao();
  munSel=null; featureSel=null; chaveSel=null;
  setHash('ind/'+indToSlug[IND]);
}

// ─── BUSCA (fuzzy via Fuse.js) ────────────────────────────────────────────────
function buildSearchIndex(){
  const list=D.municipios.map(m=>({m,n:nrm(m.m),u:m.u}));
  if(window.Fuse){
    FUSE=new Fuse(list,{
      keys:[{name:'n',weight:.85},{name:'u',weight:.15}],
      threshold:.4,ignoreLocation:true,minMatchCharLength:2,includeScore:true
    });
  }
}
function searchMun(q){
  const res=document.getElementById('srch-res');
  if(!q||q.length<2){res.innerHTML='';return;}
  const qn=nrm(q);
  let found;
  if(FUSE){
    found=FUSE.search(qn).slice(0,12).map(r=>r.item.m);
  }else{
    found=D.municipios.filter(m=>nrm(m.m).includes(qn)||nrm(m.u).includes(qn)).slice(0,12);
  }
  if(!found.length){res.innerHTML='<div class="sr-empty">Nenhum município encontrado.</div>';return;}
  res.innerHTML='';
  for(const m of found){
    const pop=m.i['POPULAÇÃO 2025'];
    const el=document.createElement('div');
    el.className='sr';
    el.innerHTML=`<div class="sr-nm"><b>${m.m}</b>
      <div class="sr-meta">${m.r}${pop?' · '+fmtPop(pop)+' hab.':''}</div></div>
      <span class="sr-uf">${m.u}</span>`;
    el.onclick=()=>selecionarPorChave(chaveOf(m),false);
    res.appendChild(el);
  }
}

function selecionarPorChave(chave,fromHash){
  const m=munIdx[chave];
  if(!m) return;
  const layer=layerByChave[chave]||null;
  selecionarMun(m,layer,chave,fromHash);
}

// ─── RANKINGS ─────────────────────────────────────────────────────────────────
function setDir(d){
  rankDir=d;
  document.getElementById('tog-top').className='tog'+(d==='top'?' on':'');
  document.getElementById('tog-bot').className='tog'+(d==='bot'?' on':'');
  buildRank();
}

function buildRank(){
  const inds=GRUPOS[catRank]||[];
  if(!inds.includes(rankInd)) rankInd=inds[0];
  const sel=document.getElementById('rk-sel');
  sel.innerHTML=inds.map(i=>`<option value="${i}" ${i===rankInd?'selected':''}>${D.meta[i]?D.meta[i].nome:i}</option>`).join('');

  // Top 10 municípios + mini barras
  let vs=D.municipios.map(m=>({m,v:m.i[rankInd]})).filter(x=>x.v!=null);
  vs.sort((a,b)=>rankDir==='top'?b.v-a.v:a.v-b.v);
  const top=vs.slice(0,10);
  const maxMun=Math.max(...top.map(x=>Math.abs(x.v)),1);
  const munWrap=document.getElementById('rk-mun');
  munWrap.innerHTML='';
  top.forEach((x,i)=>{
    const el=document.createElement('div');
    el.className='rk-item';
    el.innerHTML=`<span class="rk-pos">${i+1}</span>
      <span class="rk-nm">${x.m.m} <span class="rk-uf">${x.m.u}</span></span>
      <span class="rk-bar-wrap"><span class="rk-bar" style="width:${(Math.abs(x.v)/maxMun*100).toFixed(0)}%;background:${corInd(x.v,rankInd)}"></span></span>
      <span class="rk-v">${fmt(x.v)}</span>`;
    el.onclick=()=>selecionarPorChave(chaveOf(x.m),false);
    munWrap.appendChild(el);
  });

  // Estados — média ponderada por população
  const ufSoma={},ufPop={},ufN={};
  for(const m of D.municipios){
    const v=m.i[rankInd]; const pop=m.i['POPULAÇÃO 2025']||0;
    if(v==null) continue;
    if(!ufSoma[m.u]){ufSoma[m.u]=0;ufPop[m.u]=0;ufN[m.u]=0;}
    ufSoma[m.u]+=v*pop; ufPop[m.u]+=pop; ufN[m.u]++;
  }
  let estVs=Object.keys(ufSoma).map(u=>({u,v:ufPop[u]>0?ufSoma[u]/ufPop[u]:0,n:ufN[u]}));
  estVs.sort((a,b)=>rankDir==='top'?b.v-a.v:a.v-b.v);
  const maxEst=Math.max(...estVs.map(x=>Math.abs(x.v)),1);

  const metaNote=`<div style="font-size:.62rem;color:var(--muted);padding:5px 7px;
    background:var(--bg);border-radius:5px;margin-bottom:8px;line-height:1.4">
    Média ponderada pela população de cada município.<br>
    Municípios maiores têm mais peso no resultado do estado.
  </div>`;
  const estWrap=document.getElementById('rk-est');
  estWrap.innerHTML=metaNote;
  estVs.forEach((x,i)=>{
    const el=document.createElement('div');
    el.className='rk-item';
    el.innerHTML=`<span class="rk-pos">${i+1}</span>
      <span class="rk-nm">${x.u} <span class="rk-uf">${x.n} mun.</span></span>
      <span class="rk-bar-wrap"><span class="rk-bar" style="width:${(Math.abs(x.v)/maxEst*100).toFixed(0)}%;background:${corInd(x.v,rankInd)}"></span></span>
      <span class="rk-v">${fmt(x.v)}</span>`;
    estWrap.appendChild(el);
  });
}

// ─── EXPORTAR CSV ─────────────────────────────────────────────────────────────
function exportCSV(){
  const ind=rankInd, meta=D.meta[ind];
  let rows=D.municipios.map(m=>({m,v:m.i[ind]})).filter(x=>x.v!=null);
  rows.sort((a,b)=>rankDir==='top'?b.v-a.v:a.v-b.v);
  const sep=';';
  const head=['Posicao','Municipio','UF','Regiao','Indicador','Valor','Unidade'];
  const lines=[head.join(sep)];
  rows.forEach((x,i)=>{
    lines.push([
      i+1, csvq(x.m.m), x.m.u, csvq(x.m.r), csvq(meta?meta.nome:ind),
      String(x.v).replace('.',','), csvq(meta?meta.unidade:'')
    ].join(sep));
  });
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='ips_ranking_'+indToSlug[ind]+'_'+(rankDir==='top'?'maiores':'menores')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvq(s){s=String(s); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}

// ─── PERMALINK (hash da URL) ──────────────────────────────────────────────────
function setHash(h){selfHash=h; if(location.hash.slice(1)!==h) location.hash=h;}
function aplicarHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h){setIndicador(IND,true);return;}
  const sl=h.indexOf('/');
  const tipo=sl<0?h:h.slice(0,sl), val=sl<0?'':h.slice(sl+1);
  if(tipo==='mun'){
    const k=cdToChave[val];
    if(k&&munIdx[k]){selecionarPorChave(k,true);return;}
  }else if(tipo==='ind'){
    const ind=slugToInd[val];
    if(ind){setIndicador(ind,true);return;}
  }
}
function onHashChange(){
  const h=location.hash.slice(1);
  if(h===selfHash) return;   // mudança feita pela própria app
  aplicarHash();
}

// ─── TABS & UI ────────────────────────────────────────────────────────────────
function showTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(btn) btn.classList.add('on');
  ['mapa','explorar','rankings'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===tab?'flex':'none';
  });
  if(tab==='mapa') document.getElementById('tab-mapa').style.flexDirection='column';
  if(window.innerWidth<=768&&!document.body.classList.contains('desktop')) openPanel();
}

let panelOpen=false;
function togglePanel(){panelOpen=!panelOpen;document.getElementById('panel').classList.toggle('open',panelOpen);}
function openPanel(){panelOpen=true;document.getElementById('panel').classList.add('open');}
function closePanel(){panelOpen=false;document.getElementById('panel').classList.remove('open');}
function toggleDesktop(){
  document.body.classList.toggle('desktop');
  const on=document.body.classList.contains('desktop');
  const btn=document.getElementById('btn-desktop');
  btn.classList.toggle('on',on);
  btn.innerHTML=on?'<i data-lucide="smartphone"></i> Mobile':'<i data-lucide="monitor"></i> Desktop';
  icons();
  setTimeout(()=>leaf&&leaf.invalidateSize(),350);
}

// ─── FORMAT ───────────────────────────────────────────────────────────────────
function fmt(v){
  if(v==null) return'—';
  if(Math.abs(v)>=1e6) return(v/1e6).toFixed(1)+'M';
  if(Math.abs(v)>=1e3) return(v/1e3).toFixed(1)+'k';
  if(Math.abs(v)>=100) return Math.round(v).toLocaleString('pt-BR');
  return parseFloat(v.toFixed(2)).toString();
}
function abbr(n){
  if(n>=1e3) return(n/1e3).toFixed(n>=1e4?0:1)+'k';
  return String(n);
}
function fmtPop(v){
  if(v>=1e6) return(v/1e6).toFixed(1)+'M';
  if(v>=1e3) return(v/1e3).toFixed(0)+'k';
  return Math.round(v).toString();
}

// ─── START ────────────────────────────────────────────────────────────────────
icons();   // ícones estáticos do header/tabs
boot();
